name: Build All

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: 01-server/go.sum

      - name: Build linux binaries
        working-directory: 01-server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/location-share-server-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/location-share-server-linux-arm64 .

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: 01-server/dist/
          if-no-files-found: error

  device-agent:
    name: Build Device Agent and Magisk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: 03-device/agent/go.sum

      - name: Cross-compile agent
        working-directory: 03-device/agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/location_share_agent_arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/location_share_agent_armv7 .

      - name: Package Magisk module (arm64)
        run: |
          mkdir -p /tmp/magisk/META-INF/com/google/android
          mkdir -p /tmp/magisk/system/bin
          cp 03-device/magisk-module/module.prop /tmp/magisk/
          cp 03-device/magisk-module/service.sh /tmp/magisk/
          cp 03-device/magisk-module/config.example /tmp/magisk/
          cp 03-device/magisk-module/README.md /tmp/magisk/
          cp 03-device/magisk-module/META-INF/com/google/android/update-binary /tmp/magisk/META-INF/com/google/android/
          cp 03-device/magisk-module/META-INF/com/google/android/updater-script /tmp/magisk/META-INF/com/google/android/
          cp 03-device/agent/dist/location_share_agent_arm64 /tmp/magisk/system/bin/location_share_agent
          chmod 755 /tmp/magisk/service.sh
          chmod 755 /tmp/magisk/META-INF/com/google/android/update-binary
          chmod 755 /tmp/magisk/system/bin/location_share_agent
          cd /tmp/magisk
          zip -r9 "$GITHUB_WORKSPACE/03-device/agent/dist/location_share_device_magisk.zip" \
            META-INF module.prop service.sh config.example system README.md

      - name: Upload agent and Magisk
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-magisk
          path: |
            03-device/agent/dist/location_share_agent_arm64
            03-device/agent/dist/location_share_agent_armv7
            03-device/agent/dist/location_share_device_magisk.zip
          if-no-files-found: error

  android-client:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and build debug APK
        working-directory: 02-client
        run: |
          GRADLE_VERSION=8.2.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: 02-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
